<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlashTrace synthetic page: animated GIF</title>
<!--
  Synthetic capture test page (deliberately flashing; only ever opened by FlashTrace's own tests).
  Nothing on this page is animated by CSS, the Web Animations API or script. The only motion is
  anim.gif: two 100x100 frames (black, white) with a 12-centisecond delay each, generated by
  capture/tests/test_strategies.py's sibling script with Pillow. GIF delays are whole centiseconds,
  so the 125 ms needed for an exact 4 Hz flash is not representable; 120 ms gives a 240 ms period,
  i.e. 4.17 flashes per second (above the WCAG 2.3.1 "more than three" limit either way).
  The image sits at (250,200), so its centre is (300,250): the same probe pixel the other synthetic
  pages use. Strategy A cannot drive an image's animation clock, so detect.py must report this page
  as uncontrollable ("animated-gif") and "auto" must skip A.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; width: 100%; height: 100%; overflow: hidden; }
  #gif { position: absolute; left: 250px; top: 200px; width: 100px; height: 100px; }
</style>
</head>
<body>
  <img id="gif" src="anim.gif" width="100" height="100" alt="">
</body>
</html>
