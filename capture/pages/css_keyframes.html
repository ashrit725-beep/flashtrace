<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlashTrace synthetic page: CSS keyframes</title>
<!--
  Synthetic capture test page (deliberately flashing; only ever opened by FlashTrace's own tests).
  Visual contract shared by css_keyframes.html, waapi.html and raf.html:
    * white page background, no text, no network fonts;
    * #box: 400x300 CSS px at (100,100), background toggling black/white at 4 Hz
      (period 250 ms: black for 0-125 ms, white for 125-250 ms) with a step function;
    * #fade: 200x200 CSS px at (600,100), dark grey, opacity ramping 0 -> 1 -> 0 over 2 s (0.5 Hz).
  This file drives both with CSS @keyframes animations.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; width: 100%; height: 100%; overflow: hidden; }
  #box  { position: absolute; left: 100px; top: 100px; width: 400px; height: 300px; background-color: #000;
          animation: ft-blink 250ms steps(1, end) infinite; }
  #fade { position: absolute; left: 600px; top: 100px; width: 200px; height: 200px; background-color: #333;
          animation: ft-fade 2000ms linear infinite; }
  /* steps(1, end) holds each keyframe's value for its whole segment: black on [0%,50%), white on [50%,100%). */
  @keyframes ft-blink { 0% { background-color: #000; } 50% { background-color: #fff; } 100% { background-color: #000; } }
  @keyframes ft-fade  { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div id="box"></div>
  <div id="fade"></div>
</body>
</html>
