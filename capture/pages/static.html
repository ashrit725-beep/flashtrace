<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlashTrace synthetic page: static</title>
<!--
  Control page for the capture tests: the same two boxes as css_keyframes.html but nothing moves.
  Every captured frame must be identical, and document.getAnimations() must be empty.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; width: 100%; height: 100%; overflow: hidden; }
  #box  { position: absolute; left: 100px; top: 100px; width: 400px; height: 300px; background-color: #000; }
  #fade { position: absolute; left: 600px; top: 100px; width: 200px; height: 200px; background-color: #333; opacity: 0.5; }
</style>
</head>
<body>
  <div id="box"></div>
  <div id="fade"></div>
</body>
</html>
