[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashtrace"
version = "0.1.0"
description = "Local-first WCAG 2.3.1 (Three Flashes or Below Threshold) auditor with attribution and fix verification. Analysis aid, not a compliance certification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "playwright>=1.49",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jsonschema>=4.21",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[project.scripts]
flashtrace = "cli.main:app"

[tool.setuptools]
packages = ["engine", "engine.schema", "capture", "cli", "server", "bench"]

[tool.setuptools.package-data]
"engine.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "engine/tests", "capture/tests", "server/tests", "bench/tests", "cli/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "browser: needs headless Chromium (deselect with -m 'not browser')",
]
